<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="An accessible and responsive to-do list application."
    />

    <title>To-Do List</title>
  </head>

  <body>
    <header>
      <h1>To-Do List</h1>

      <p>
        Keep track of the things you need to get done.
      </p>
    </header>

    <main>
      <section aria-labelledby="add-task-heading">
        <h2 id="add-task-heading">Add a task</h2>

        <form id="todo-form">
          <label for="todo-input">Task</label>

          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="Enter a task"
            autocomplete="off"
            required
          />

          <button type="submit">Add task</button>
        </form>
      </section>

      <section aria-labelledby="tasks-heading">
        <h2 id="tasks-heading">Your tasks</h2>

        <div aria-label="Task filters" role="group">
          <button type="button" data-filter="all">
            All
          </button>

          <button type="button" data-filter="active">
            Active
          </button>

          <button type="button" data-filter="completed">
            Completed
          </button>
        </div>

        <ul id="todo-list">
          <li>No tasks yet.</li>
        </ul>
      </section>
    </main>

    <footer>
      <p>To-Do List</p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
